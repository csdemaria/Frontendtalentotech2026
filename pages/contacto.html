<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talento Tech Frontend</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>

    <header class="header">
        <a href="index.html">
            <img src="img/logo.png" alt="Logo" class="logo">
        </a>

        <div class="header_menu">
            <ul class="navbar">
                <li><a href="index.html" class="header_menu-link">Home</a></li>
                <li><a href="tienda.html" class="header_menu-link">Tienda</a></li>
                <li><a href="blog.html" class="header_menu-link">Blog</a></li>
                <li><a href="nosotros.html" class="header_menu-link">Nosotros</a></li>
                <li><a href="pages/contacto.html" class="header_menu-link">Contacto</a></li>
                <li><a href="carrito.html" class="header_menu-link">Carrito</a></li>
            </ul>
        </div>

        <div class="mobile">
            <a href="carrito.html" >
                <img src="img/carrito.png" alt="carrito" class="carrito">
            </a>

             
             <img src="img/menu.png" alt="menu" class="menu">
            
        </div>

    </header>


    <nav></nav>

    <main>
      <section>
            <form action="" method="post">
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Tu email" required>
                </div>

                <div>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Tu mensaje" required></textarea>
                </div>

                <button type="submit">Enviar</button>
            </form>
        </section>
    
    </main>

    

    <footer class="footer"></footer>


</body>
</html>
